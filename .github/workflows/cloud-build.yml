# Toki CI — Google Cloud Build configuration.
#
# This example workflow runs type checking, linting, testing, and build
# verification on Google Cloud Build. Adjust the `machineType` and timeout
# for your project's needs.

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install pnpm
    id: pnpm-setup
    uses: pnpm/action-setup@v4
    with:
      version: 10

  - name: Setup Node.js 24
    uses: actions/setup-node@v4
    with:
      node-version: 24
      cache: pnpm

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  - name: Type check
    run: pnpm typecheck

  - name: Lint
    run: pnpm lint

  - name: Run tests
    run: pnpm test

  - name: Build
    run: pnpm build

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 600s

# Alternative: if you are using a cloudbuild.yaml in a GCB-native project
# (not GitHub Actions), replace the top-level `steps` with this format:
#
# steps:
#   - name: node:24
#     entrypoint: pnpm
#     args: ["install", "--frozen-lockfile"]
#   - name: node:24
#     entrypoint: pnpm
#     args: ["typecheck"]
#   - name: node:24
#     entrypoint: pnpm
#     args: ["lint"]
#   - name: node:24
#     entrypoint: pnpm
#     args: ["test"]
#   - name: node:24
#     entrypoint: pnpm
#     args: ["build"]
